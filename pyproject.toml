[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "usernotes"
description = "Command line tools for the reddit Moderator Toolbox usernotes store"
requires-python = ">=3.11"
dynamic = ["version"]
# The runtime is otherwise the standard library: `usernotes.cookies` decrypts
# Chromium cookie values with its own pure-python AES, using pycryptodome only
# as an optional speed-up.
#
# `secretstorage` is Linux only, and it is what reads a chromium cookie store's
# key out of the desktop keyring over D-Bus - without it the store's `v11`
# cookies cannot be decrypted, which on an encrypted store is the reddit
# session cookie and so every authenticated request (see browser-cookies.md).
# KWallet is read by shelling out to kwallet-query instead, and macOS and
# Windows use their own platform mechanisms, so nothing else needs it.
dependencies = [
    "secretstorage>=3.3; sys_platform == 'linux'",
]

[project.scripts]
usernotes = "usernotes.cli:main"

[tool.setuptools]
packages = ["usernotes", "usernotes._vendor"]

[tool.setuptools.dynamic]
version = {attr = "usernotes._version.__version__"}
